# 🎭 EtherealDimension (Hylios) — XcodeGen project manifest
# Regenerates a clean SwiftUI/Swift-6 project. Run: `xcodegen generate`
name: EtherealDimension
options:
  bundleIdPrefix: com.binarybros
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: 5Y7NBCKHJP
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "260905005"
targets:
  EtherealDimension:
    type: application
    platform: iOS
    sources:
      - path: EtherealDimension
        excludes:
          - "AppDelegate.swift"
          - "SceneDelegate.swift"
          - "RoomCaptureViewController.swift"
          - "RoomTypeViewController.swift"
          - "OnboardingViewController.swift"
          - "Main.storyboard"
          - "UnsupportedDevice.storyboard"
          - "LaunchScreen.storyboard"
          - "Info.plist"
          - "art.scnassets"
      - ScanActivity/ScanActivityAttributes.swift
    dependencies:
      - target: HyliosScanActivity
        embed: true
      # 🚪 App Clip deliberately NOT embedded (2026-09-05). Shipping a clip makes an
      #    App Clip default experience — a 3000×2000 card + subtitle — MANDATORY for
      #    App Store review, and that artwork doesn't exist yet. The HyliosClip target
      #    below is kept intact and buildable; re-add this dependency to ship it.
      #    See TODO.md → "App Clip".
      # - target: HyliosClip
      #   embed: true
    info:
      path: EtherealDimension/Info.plist
      properties:
        CFBundleDisplayName: Hylios
        NSCameraUsageDescription: "Hylios uses the camera to scan your space into a 3D model."
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 🔄 Apple rejects iPad-capable bundles that stay silent on orientation —
        #    iPad must offer all four or declare itself full-screen-only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binarybros.EtherealDimension
        # 📱 iPhone only — matches the shipping 1.3 listing. The rewrite had set "1,2",
        #    silently adding iPad support the app never had, which makes iPad
        #    screenshots mandatory for review. Hylios also gates on LiDAR, so no
        #    simulator can produce a usable iPad shot anyway.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
  HyliosScanActivity:
    type: app-extension
    platform: iOS
    sources:
      - ScanActivity
    info:
      path: ScanActivity/Info.plist
      properties:
        CFBundleDisplayName: Hylios Scan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binarybros.EtherealDimension.ScanActivity
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5Y7NBCKHJP
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
  HyliosClip:
    type: com.apple.product-type.application.on-demand-install-capable
    platform: iOS
    sources:
      - AppClip
      - path: EtherealDimension
        excludes:
          - "HyliosApp.swift"
          - "Info.plist"
      - ScanActivity/ScanActivityAttributes.swift
    info:
      path: AppClip/Info.plist
      properties:
        CFBundleDisplayName: Hylios
        NSCameraUsageDescription: "Hylios uses the camera to scan your space into a 3D model."
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 🎩 XcodeGen omits this for on-demand-install-capable targets, and Apple
        #    rejects the clip without it: "Invalid Bundle OS Type code."
        CFBundlePackageType: APPL
        # 🔄 Same orientation contract as the parent app (see above)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binarybros.EtherealDimension.Clip
        CODE_SIGN_ENTITLEMENTS: AppClip/HyliosClip.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5Y7NBCKHJP
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EtherealDimensionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EtherealDimensionTests
    dependencies:
      - target: EtherealDimension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binarybros.EtherealDimensionTests
        GENERATE_INFOPLIST_FILE: "YES"
  EtherealDimensionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EtherealDimensionUITests
    dependencies:
      - target: EtherealDimension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binarybros.EtherealDimensionUITests
        GENERATE_INFOPLIST_FILE: "YES"
