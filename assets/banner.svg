<?xml version="1.0" encoding="UTF-8"?>
<!--
  🎭 Hylios — Magical Space Intelligence · animated hero banner
  Technique: SMIL <animate> served raw via <img> so the browser plays it
  (same trick as browser-use/browser-harness banner-ink.svg).
  Honors prefers-reduced-motion: all animation elements stop, static state remains.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 614" width="1536" height="614" role="img" aria-label="Hylios — Magical Space Intelligence">
  <title>Hylios — Magical Space Intelligence</title>
  <desc>Animated banner: a luminous LiDAR scan plane sweeps across a perspective grid floor beneath the Hylios wordmark.</desc>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>

  <defs>
    <!-- ✨ ethereal background mesh (the deep of the dimension) -->
    <radialGradient id="bgCyan" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#14606E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#06060E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgViolet" cx="84%" cy="82%" r="62%">
      <stop offset="0%" stop-color="#3E2589" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#06060E" stop-opacity="0"/>
    </radialGradient>

    <!-- 🌈 living wordmark ink (animated violet→cyan) -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A6BFF">
        <animate attributeName="stop-color" values="#8A6BFF;#2BD4EE;#8A6BFF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#43E0F0">
        <animate attributeName="stop-color" values="#43E0F0;#B98BFF;#43E0F0" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2BD4EE">
        <animate attributeName="stop-color" values="#2BD4EE;#8A6BFF;#2BD4EE" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 💧 soft bloom for wordmark + beam -->
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="beamGlow" x="-60%" y="-10%" width="220%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- 🔵 the scan plane gradient (transparent→core→transparent) -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BD4EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8F6FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2BD4EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 🌌 the void -->
  <rect width="1536" height="614" fill="#06060E"/>
  <rect width="1536" height="614" fill="url(#bgCyan)"/>
  <rect width="1536" height="614" fill="url(#bgViolet)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- 🔲 perspective scanner floor — vanishing point (768, 360), base y=548 -->
  <g stroke="#2C5862" stroke-width="1.4" fill="none" opacity="0.55">
    <!-- edges -->
    <line x1="768" y1="360" x2="80"   y2="548"/>
    <line x1="768" y1="360" x2="1456" y2="548"/>
    <!-- radiating spokes -->
    <line x1="768" y1="360" x2="240"  y2="548"/>
    <line x1="768" y1="360" x2="420"  y2="548"/>
    <line x1="768" y1="360" x2="600"  y2="548"/>
    <line x1="768" y1="360" x2="940"  y2="548"/>
    <line x1="768" y1="360" x2="1120" y2="548"/>
    <line x1="768" y1="360" x2="1300" y2="548"/>
    <!-- depth lines (half-width grows with depth) -->
    <line x1="651"  y1="392" x2="885"  y2="392"/>
    <line x1="534"  y1="424" x2="1002" y2="424"/>
    <line x1="402"  y1="460" x2="1134" y2="460"/>
    <line x1="255"  y1="500" x2="1281" y2="500"/>
    <line x1="80"   y1="548" x2="1456" y2="548"/>
  </g>

  <!-- 🔵 sweeping LiDAR scan plane (fades in/out across the floor) -->
  <g>
    <rect x="-34" y="360" width="68" height="188" fill="url(#beam)" filter="url(#beamGlow)"/>
    <rect x="-2"  y="360" width="4"  height="188" fill="#CFFFFE" opacity="0.85"/>
    <animateTransform attributeName="transform" type="translate"
      values="80 0; 1456 0" keyTimes="0;1"
      calcMode="spline" keySplines="0.45 0 0.55 1"
      dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;1;1;0" keyTimes="0;0.12;0.88;1"
      dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- 🌠 drifting point-cloud motes -->
  <g fill="#6FE3F0">
    <circle cx="140"  cy="96"  r="2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle cx="305"  cy="146" r="1.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.1s" begin="0.6s"  repeatCount="indefinite"/></circle>
    <circle cx="520"  cy="84"  r="2.4"><animate attributeName="opacity" values="0.2;1;0.2"   dur="3.6s" begin="1.1s"  repeatCount="indefinite"/></circle>
    <circle cx="1018" cy="72"  r="2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.8s" begin="0.3s"  repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="150" r="1.8"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="5.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1392" cy="104" r="2.2"><animate attributeName="opacity" values="0.2;1;0.2"   dur="3.9s" begin="0.9s"  repeatCount="indefinite"/></circle>
    <circle cx="224"  cy="206" r="1.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="6s"   begin="2.1s"  repeatCount="indefinite"/></circle>
    <circle cx="648"  cy="186" r="2"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.5s" begin="0.4s"  repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="214" r="1.7"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.2s" begin="1.3s"  repeatCount="indefinite"/></circle>
    <circle cx="1310" cy="244" r="2.1"><animate attributeName="opacity" values="0.2;1;0.2"   dur="3.8s" begin="0.7s"  repeatCount="indefinite"/></circle>
    <circle cx="420"  cy="236" r="1.6"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="5.7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="880"  cy="160" r="1.9"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 🖼️ HUD corner brackets (the scanner frame) -->
  <g stroke="#2E9AA6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M52,112 L52,60 L104,60"/>
    <path d="M1484,112 L1484,60 L1432,60"/>
    <path d="M52,500 L52,556 L104,556"/>
    <path d="M1484,500 L1484,556 L1432,556"/>
  </g>

  <!-- 🪄 the wordmark — HYLIOS, living ink -->
  <text x="770" y="276" text-anchor="middle"
        font-family="SF Pro Display, Helvetica Neue, Segoe UI, Arial, sans-serif"
        font-size="158" font-weight="800" letter-spacing="12"
        fill="#8A6BFF" opacity="0.35" filter="url(#bloom)">HYLIOS</text>
  <text x="770" y="276" text-anchor="middle"
        font-family="SF Pro Display, Helvetica Neue, Segoe UI, Arial, sans-serif"
        font-size="158" font-weight="800" letter-spacing="12"
        fill="url(#ink)">HYLIOS</text>

  <!-- 📜 the tagline -->
  <text x="770" y="322" text-anchor="middle"
        font-family="SF Pro Display, Helvetica Neue, Segoe UI, Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="11"
        fill="#5FD3E0" opacity="0.85">MAGICAL · SPACE · INTELLIGENCE</text>
</svg>
